<!doctype html>
<html lang="nn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4e79">
  <title>{% block title %}Treningstider Blixhalli{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #d9dde3;
      --accent: #1f4e79; --accent-text: #ffffff;
      --fotball: #d7ecd9; --handball: #fde2c8; --friidrett: #dbe6fb; --trim: #f6d8e8;
      --volleyball: #fff1b8; --badminton: #e3dcf7; --anna: #e6e8eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151a; --surface: #1b1f26; --text: #e8eaed; --muted: #9aa3ae; --line: #2e343d;
        --accent: #6aa5dc; --accent-text: #0d1117;
        --fotball: #23402a; --handball: #4a3320; --friidrett: #233452; --trim: #47283a;
        --volleyball: #463d1a; --badminton: #342b4d; --anna: #2c3139;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.4; }
    header { background: var(--accent); color: var(--accent-text); padding: 12px 16px;
             display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
    header h1 { font-size: 1.15rem; margin: 0; flex: 1 1 auto; }
    header a { color: inherit; }
    main { padding: 16px; max-width: 1400px; margin: 0 auto; }
    a { color: var(--accent); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1><a href="{% if static_export %}index.html{% else %}/{% endif %}" style="text-decoration:none">Treningstider Blixhalli</a></h1>
    {% if static_export %}
    {% elif user.is_staff %}
      <a href="/admin/">Administrer</a>
      <form method="post" action="/admin/logout/" style="margin:0">{% csrf_token %}
        <button type="submit" style="background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0">Logg ut</button>
      </form>
    {% else %}
      <a href="/admin/login/?next={{ request.path|urlencode }}">Logg inn</a>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
