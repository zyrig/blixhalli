{% extends "bookings/base.html" %}
{% block title %}Lag passord – Blixhalli{% endblock %}
{% block content %}
<div class="narrow">
{% if validlink %}
  <h2>Lag passord</h2>
  <form method="post" class="card">{% csrf_token %}{{ form.as_div }}<button type="submit" class="btn">Lagre passord</button></form>
{% else %}
  <h2>Lenkja er ikkje gyldig</h2>
  <p>Lenkja er brukt eller har gått ut. <a href="{% url 'password_reset' %}">Be om ei ny lenkje</a>.</p>
{% endif %}
</div>
{% endblock %}
